[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urbantools"
version = "0.0.14"
description = "Urban analysis and processing tools"
authors = [
    {name = "Physycom City Science Lab"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "networkx",
    "numpy",
    "shapely",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/physycom/urbantools"
Repository = "https://github.com/physycom/urbantools"
Issues = "https://github.com/physycom/urbantools/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["urbantools*"]

[tool.setuptools.package-data]
urbantools = ["py.typed"]
